<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    /* dark theme (default brand look — Ink) */
    --bg: #0F0F0F;
    --wm-re: rgba(255,255,255,0.32);
    --wm-franco: #FAFAF8;
    --muted: rgba(250,250,248,0.35);
  }
  html.light {
    --bg: #E8E6E1;
    --wm-re: rgba(0,0,0,0.2);
    --wm-franco: #111111;
    --muted: #888780;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo { display: inline-flex; flex-direction: column; align-items: center; }
  .main {
    font-size: 260px;
    line-height: 1.1;
    display: flex;
    align-items: baseline;
    white-space: nowrap;
  }
  .re {
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    font-weight: 400;
    color: var(--wm-re);
    margin-right: -0.08em;
  }
  .franco {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    color: var(--wm-franco);
  }
  .ai {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    color: #C8323C;
    font-size: 0.35em;
    letter-spacing: 0.1em;
  }
  .tagline {
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    font-weight: 400;
    font-size: 51px;            /* 0.196 * 260, ratio del tamaño xl del componente */
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-top: 37px;          /* 0.143 * 260 */
    line-height: 1;
    text-align: center;
    /* compensa el letter-spacing del último glifo para centrar óptico */
    text-indent: 0.2em;
  }
</style>
</head>
<body>
  <span class="logo">
    <span class="main"><span class="re">re</span><span class="franco">franco</span><span class="ai">.ai</span></span>
    <span class="tagline">Real estate en su estado más franco</span>
  </span>
  <script>
    if (new URLSearchParams(location.search).get('theme') === 'light') {
      document.documentElement.classList.add('light');
    }
  </script>
</body>
</html>
